[project]
name = "sig500-campaign"
version = "0.1.0"
description = "Plan Signature500 deployments for Sentinel-1 collocations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "lxml>=5.0",
  "pyyaml>=6.0",
  "shapely>=2.0",
  "typer>=0.12",
]

[project.scripts]
sig500-campaign = "sig500_campaign.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
